name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: myapp

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create fresh Flutter project
        run: flutter create --project-name sklad_inventar freshapp

      - name: Copy source files into fresh project
        run: |
          cp -r myapp/lib/* freshapp/lib/
          cp myapp/pubspec.yaml freshapp/pubspec.yaml
          cp myapp/android/app/src/main/AndroidManifest.xml \
             freshapp/android/app/src/main/AndroidManifest.xml
          cp myapp/android/app/build.gradle freshapp/android/app/build.gradle
          cp myapp/android/build.gradle freshapp/android/build.gradle
          cp myapp/android/gradle.properties freshapp/android/gradle.properties
          cp myapp/android/settings.gradle freshapp/android/settings.gradle

      - name: Copy icons
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -d "myapp/android/app/src/main/res/mipmap-$density" ]; then
              cp -f myapp/android/app/src/main/res/mipmap-$density/ic_launcher.png \
                freshapp/android/app/src/main/res/mipmap-$density/ic_launcher.png
              echo "Copied mipmap-$density"
            else
              echo "Not found: mipmap-$density"
            fi
          done

      - name: Copy assets
        run: |
          mkdir -p freshapp/assets/icon
          if [ -d "myapp/assets/icon" ]; then
            cp -r myapp/assets/icon/* freshapp/assets/icon/
            echo "Assets copied"
            ls freshapp/assets/icon/
          else
            echo "No assets folder found"
          fi

      - name: Fix Gradle version
        working-directory: freshapp
        run: |
          sed -i 's/gradle-7[^ ]*\.zip/gradle-8.0-all.zip/g' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        working-directory: freshapp
        run: flutter pub get

      - name: Create local.properties
        working-directory: freshapp
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Build APK
        working-directory: freshapp
        run: flutter build apk --release
        continue-on-error: true

      - name: Find and copy APK
        run: |
          mkdir -p output
          find . -name "*.apk" | sort
          find . -name "*.apk" -exec cp {} output/Scan.apk \; || echo "No APK found"

      - uses: actions/upload-artifact@v4
        with:
          name: Scan
          path: output/Scan.apk
